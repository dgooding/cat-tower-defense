<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Catastrophe! · Play</title>
    <meta name="description" content="Catastrophe! The Great Snack Defense — a cozy, silly cat tower defense. Click PLAY and defend the snacks." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/tokens.css?v=1" />
    <link rel="stylesheet" href="./css/game.css?v=2" />
    <script>
      // Error catcher (classic script so it works even if a module fails to load). Red box with ?debug=1.
      (function () {
        var dbg = /[?&]debug=1/.test(location.search);
        var errs = (window.__cataErrors = []);
        function show() {
          if (!dbg || !document.body) return;
          var el = document.getElementById('debug-box');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'debug-box';
            document.body.appendChild(el);
          }
          el.textContent = errs.slice(-14).join('\n');
          el.hidden = !errs.length;
        }
        window.__cataReport = function (msg) {
          errs.push(String(msg).slice(0, 400));
          console.warn('[cata]', msg);
          show();
        };
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t !== window && t.tagName) {
              if (t.tagName !== 'LINK') window.__cataReport('Failed to load ' + (t.src || t.href || t.tagName));
              return;
            }
            window.__cataReport('Error: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
          },
          true
        );
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          window.__cataReport('Promise: ' + ((r && (r.stack || r.message)) || r));
        });
        addEventListener('DOMContentLoaded', show);
      })();
    </script>
  </head>
  <body class="game" data-screen="boot">
    <div id="stage">
      <canvas id="game" aria-label="Game stage: cats on cushions defend the Snack Stash"></canvas>
      <div id="ui">
        <div id="screen"><div class="boot">Waking up the cats…</div></div>
      </div>
    </div>
    <button id="tie" type="button" title="Boss Key (`)" aria-label="Boss Key: hide the game">👔</button>
    <div id="rotate" aria-hidden="true"><span>🐱↻</span><p>Turn your phone sideways. The cats prefer landscape.</p></div>
    <noscript><p class="noscript">The cats need JavaScript to defend the snacks.</p></noscript>
    <script type="module" src="./js/ui/main.js?v=2"></script>
  </body>
</html>
